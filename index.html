<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D 八方向指南針大冒險</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game"></div>
<section id="hud" class="glass">
  <div id="stats"><span class="tag" id="lv">第1關</span><span class="tag" id="score">分數0</span><span class="tag" id="streak">連勝0</span></div>
  <div id="task">請找出 <b>北方</b> 的門</div>
  <div id="sub">觀察右上角紅色 N 指針，再按畫面箭嘴</div>
</section>
<div id="sceneBanner">🌤️ 陽光公園</div>
<div id="dock"><div id="compass"><div id="needle"></div><div id="hub"></div><div id="n">N</div></div><button id="hint" class="glass">🧭 小提示</button></div>
<div id="pad"><button class="dir" data-i="7">↖</button><button class="dir" data-i="0">↑</button><button class="dir" data-i="1">↗</button><button class="dir" data-i="6">←</button><div class="foot">👣</div><button class="dir" data-i="2">→</button><button class="dir" data-i="5">↙</button><button class="dir" data-i="4">↓</button><button class="dir" data-i="3">↘</button></div>
<div id="toast"></div>
<div id="modal"><div id="card"><button id="close">×</button><h2>八方位指南針</h2><div id="big"></div></div></div>
<div id="transition"><div><h2 id="tt">方向正確！</h2><p id="ts">準備進入新場景⋯</p></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>

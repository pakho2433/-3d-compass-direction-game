<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>3D 八方向指南針大冒險</title><style>
:root{--ink:#163852;--glass:rgba(255,255,255,.91);--blue:#8fcbe2}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#bcecff;font-family:"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;touch-action:none}canvas{display:block}.glass{background:var(--glass);border:3px solid rgba(255,255,255,.96);box-shadow:0 9px 0 rgba(71,145,176,.38),0 18px 34px rgba(20,63,84,.22);backdrop-filter:blur(9px)}#hud{position:fixed;z-index:10;left:14px;top:14px;width:min(430px,calc(100vw - 170px));padding:12px 15px;border-radius:21px;color:var(--ink)}#top{display:flex;gap:8px;flex-wrap:wrap;font-weight:900;font-size:14px}.pill{background:#e7f7fd;border-radius:999px;padding:5px 10px}#task{margin-top:8px;font-size:clamp(17px,2.5vw,25px);font-weight:1000;line-height:1.28}#task b{color:#d64b20}#sub{margin-top:5px;font-size:13px;font-weight:800;opacity:.72}
#compassDock{position:fixed;right:13px;top:13px;z-index:18;display:flex;flex-direction:column;align-items:center;gap:10px}#smallCompass{position:relative;width:116px;height:116px;border-radius:50%;background:radial-gradient(circle,#fff 0 11%,transparent 12%),repeating-conic-gradient(rgba(39,78,103,.5) 0 1.5deg,transparent 1.5deg 11.25deg),radial-gradient(circle at 42% 35%,#fff 0 54%,#e2f5fc 55% 68%,#86c1d9 69% 73%,#fff 74%);border:5px solid white;box-shadow:0 8px 0 #76abc1,0 15px 28px rgba(20,56,76,.24)}#needle{position:absolute;inset:0;transform-origin:center;transition:.45s transform}#needle:before{content:"";position:absolute;left:50%;top:13%;width:14px;height:40%;transform:translateX(-50%);clip-path:polygon(50% 0,100% 100%,50% 82%,0 100%);background:linear-gradient(90deg,#a90808,#ff6258,#ba1010);filter:drop-shadow(0 3px 3px #0004)}#needle:after{content:"";position:absolute;left:50%;top:49%;width:10px;height:35%;transform:translateX(-50%);clip-path:polygon(0 0,50% 18%,100% 0,50% 100%);background:linear-gradient(90deg,#163852,#7897a9,#163852)}#hub{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);border:4px solid white;border-radius:50%;background:#163852;z-index:3}#nmark{position:absolute;left:50%;top:8%;transform:translate(-50%,-50%);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:2px solid white;background:#fff0ed;color:#c91515;font:1000 18px/1 sans-serif;box-shadow:0 3px 8px #5224;transition:.4s left,.4s top;z-index:4}#hintBtn{border:0;border-radius:18px;padding:11px 15px;color:var(--ink);font-size:16px;font-weight:1000;cursor:pointer;min-width:112px}#hintBtn:active{transform:translateY(6px);box-shadow:0 3px 0 rgba(71,145,176,.38)}
#pad{position:fixed;z-index:12;left:15px;bottom:15px;display:grid;grid-template-columns:repeat(3,78px);grid-template-rows:repeat(3,68px);gap:7px;padding:10px;border-radius:23px;background:#ffffffd9;box-shadow:0 15px 35px #17405a35}.dir{border:0;border-radius:17px;background:linear-gradient(#fff,#e7f6fc);color:var(--ink);font-size:39px;font-weight:1000;box-shadow:0 7px 0 #82bfd7,0 10px 16px #173e5530;cursor:pointer}.dir:active{transform:translateY(5px);box-shadow:0 2px 0 #82bfd7}.dir:disabled{opacity:.45}.center{display:grid;place-items:center;border-radius:50%;background:linear-gradient(145deg,#ffc36d,#ff8932);font-size:29px;box-shadow:inset 0 0 0 5px #ffffff55}
#toast{position:fixed;z-index:40;left:50%;top:48%;transform:translate(-50%,-50%) scale(.88);min-width:min(430px,86vw);padding:17px 22px;border-radius:23px;text-align:center;color:white;background:#153f5aee;font-size:24px;font-weight:1000;opacity:0;pointer-events:none;transition:.23s}#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}#toast span{display:block;font-size:14px;margin-top:5px;font-weight:800;opacity:.88}#toast.good{background:#24884eef}#toast.bad{background:#c83f3fef}
#overlay,#start{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:18px;background:#0b2d427a;backdrop-filter:blur(8px)}#overlay.open,#start.open{display:grid}.card{position:relative;width:min(540px,94vw);padding:20px;border-radius:31px;background:#f8fdffff;border:3px solid white;box-shadow:0 28px 85px #0019;text-align:center;color:var(--ink)}.card h1{margin:5px 45px 7px;font-size:clamp(24px,5vw,34px)}.card p{font-weight:800;line-height:1.5}.close{position:absolute;right:13px;top:13px;width:43px;height:43px;border:0;border-radius:50%;background:#e1f3fa;color:var(--ink);font-size:25px;font-weight:1000;cursor:pointer}.primary{width:100%;border:0;border-radius:17px;padding:14px;color:white;background:linear-gradient(135deg,#ff9b40,#ff603a);box-shadow:0 8px 0 #c74a2e;font-size:20px;font-weight:1000;cursor:pointer}.primary:active{transform:translateY(5px);box-shadow:0 3px 0 #c74a2e}
#bigCompass{position:relative;width:min(410px,80vw);aspect-ratio:1;margin:12px auto 3px;border-radius:50%;background:radial-gradient(circle,#fff 0 10%,transparent 10.5%),radial-gradient(circle,#fff 0 61%,transparent 61.5%),repeating-conic-gradient(#45677c 0 1.5deg,transparent 1.5deg 11.25deg),linear-gradient(145deg,#e8f8ff,#8dc9e4);border:9px solid white;box-shadow:inset 0 0 0 3px #426b83,0 14px 30px #12324644;overflow:hidden}#bigNeedle{position:absolute;inset:0;transform-origin:center;transition:.45s transform;z-index:3}#bigNeedle:before{content:"";position:absolute;left:50%;top:18%;width:18px;height:34%;transform:translateX(-50%);clip-path:polygon(50% 0,100% 100%,50% 82%,0 100%);background:linear-gradient(90deg,#b51111,#ff5a52,#d41d1d)}#bigNeedle:after{content:"";position:absolute;left:50%;top:49%;width:14px;height:34%;transform:translateX(-50%);clip-path:polygon(0 0,50% 18%,100% 0,50% 100%);background:linear-gradient(90deg,#163852,#7593a5,#163852)}#bigHub{position:absolute;left:50%;top:50%;width:25px;height:25px;transform:translate(-50%,-50%);border:5px solid white;border-radius:50%;background:#163852;z-index:5}.label{position:absolute;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);padding:5px 8px;min-width:72px;border:2px solid white;border-radius:12px;background:#fffffff2;color:var(--ink);font-size:clamp(13px,3vw,18px);font-weight:1000;white-space:nowrap;box-shadow:0 4px 10px #1940582d}.label.n{color:#c51616;background:#ffebe8f5;border-color:#ffb9b3}
#transition{position:fixed;inset:0;z-index:70;display:none;place-items:center;overflow:hidden;background:radial-gradient(circle,#e6fcff,#439acb);color:white;text-align:center}#transition.show{display:grid;animation:fade 1.65s both}#transition h2{font-size:clamp(30px,7vw,65px);text-shadow:0 7px 24px #0016;margin:0}#transition p{font-size:20px;font-weight:900}@keyframes fade{0%{opacity:0}16%,75%{opacity:1}100%{opacity:0}}.spark{position:absolute;width:13px;height:13px;border-radius:50%;background:white;animation:fly 1.3s ease-in infinite}@keyframes fly{0%{transform:translateY(100px) scale(.2);opacity:0}40%{opacity:1}100%{transform:translateY(-220px) scale(1.7);opacity:0}}
@media(max-width:650px){#hud{left:7px;top:7px;width:calc(100vw - 127px);padding:9px 11px}#task{font-size:16px}#sub{font-size:11px}#compassDock{right:6px;top:6px;gap:7px}#smallCompass{width:99px;height:99px}#hintBtn{min-width:98px;font-size:14px;padding:9px 10px}#pad{left:7px;bottom:7px;grid-template-columns:repeat(3,57px);grid-template-rows:repeat(3,54px);gap:6px;padding:8px}.dir{font-size:31px;border-radius:14px}}
</style></head><body><div id="game"></div><section id="hud" class="glass"><div id="top"><span class="pill" id="lv">第 1 關</span><span class="pill" id="score">分數 0</span><span class="pill" id="streak">連勝 0</span></div><div id="task">請找出 <b>北方</b> 的門</div><div id="sub">觀察右上角紅色 N 指針，再按畫面箭嘴</div></section><div id="compassDock"><div id="smallCompass"><div id="needle"></div><div id="hub"></div><div id="nmark">N</div></div><button id="hintBtn" class="glass">🧭 小提示</button></div><div id="pad"><button class="dir" data-i="7">↖</button><button class="dir" data-i="0">↑</button><button class="dir" data-i="1">↗</button><button class="dir" data-i="6">←</button><div class="center">👣</div><button class="dir" data-i="2">→</button><button class="dir" data-i="5">↙</button><button class="dir" data-i="4">↓</button><button class="dir" data-i="3">↘</button></div><div id="toast"></div><div id="overlay"><div class="card"><button class="close" id="close">×</button><h1>八方位指南針</h1><p>放大指南針會按照本關真正的北方顯示全部八個方位。</p><div id="bigCompass"><div id="bigNeedle"></div><div id="bigHub"></div></div></div></div><div id="start" class="open"><div class="card"><h1>🧭 3D 八方向指南針大冒險</h1><p>每關北方都可能改變。觀察右上角長期顯示的紅色 N 指針，再按八個箭嘴，讓角色走到正確的門。</p><button class="primary" id="startBtn">開始遊戲</button></div></div><div id="transition"><div><h2 id="transTitle">方向正確！</h2><p id="transSub">正在進入新場景⋯</p></div></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
(()=>{"use strict";const $=id=>document.getElementById(id),names=["北方","東北方","東方","東南方","南方","西南方","西方","西北方"],screenNames=["上方","右上","右方","右下","下方","左下","左方","左上"],vec=[{x:0,z:-1},{x:1,z:-1},{x:1,z:0},{x:1,z:1},{x:0,z:1},{x:-1,z:1},{x:-1,z:0},{x:-1,z:-1}],themes=[{name:"陽光公園",sky:0xbcecff,ground:0x78ca75,path:0xf0d6a5,roof:0xf26f5d},{name:"海濱樂園",sky:0xbbeef8,ground:0x65cbb0,path:0xeadcc0,roof:0x4f9ee7},{name:"彩虹花園",sky:0xd5e7ff,ground:0x91d274,path:0xead3bd,roof:0xb37de5},{name:"秋日廣場",sky:0xd6edf7,ground:0xa7c879,path:0xe8d0a5,roof:0xe68747}];let scene,camera,renderer,player,gates=[],clock=new THREE.Clock,level=1,score=0,streak=0,north=0,lastNorth=-1,target=0,moving=false,started=false,themeIndex=0,move=null,particles=[];const TOTAL=12,buttons=[...document.querySelectorAll('.dir')];function mat(c,rough=.75){return new THREE.MeshStandardMaterial({color:c,roughness:rough})}function box(w,h,d,c){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.castShadow=m.receiveShadow=true;return m}function cyl(r1,r2,h,c){let m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,20),mat(c));m.castShadow=m.receiveShadow=true;return m}function init(){scene=new THREE.Scene;renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;$('game').appendChild(renderer.domElement);camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,100);camera.position.set(10,14,14);camera.lookAt(0,0,0);scene.add(new THREE.HemisphereLight(0xffffff,0x587357,2.25));let sun=new THREE.DirectionalLight(0xffffff,2.4);sun.position.set(-8,15,9);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-16;sun.shadow.camera.right=16;sun.shadow.camera.top=16;sun.shadow.camera.bottom=-16;scene.add(sun);buildWorld();player=makePlayer();scene.add(player);addEventListener('resize',resize);animate()}function buildWorld(){let t=themes[themeIndex];scene.background=new THREE.Color(t.sky);let base=box(20,.65,20,t.ground);base.position.y=-.36;scene.add(base);let path1=box(18,.08,3.2,t.path);path1.position.y=.02;scene.add(path1);let path2=box(3.2,.08,18,t.path);path2.position.y=.025;scene.add(path2);for(let i=0;i<8;i++){let a=i*Math.PI/4,p=new THREE.Vector3(Math.sin(a)*7.3,0,-Math.cos(a)*7.3);let g=new THREE.Group,platform=cyl(.95,1.08,.18,0xffffff);platform.position.y=.1;platform.material.emissive=new THREE.Color(0x224466);platform.material.emissiveIntensity=.1;g.add(platform);let posts=[-.58,.58].map(x=>{let q=box(.22,2,.22,0xf7fafc);q.position.set(x,1.08,0);return q});posts.forEach(q=>g.add(q));let top=box(1.45,.25,.28,t.roof);top.position.y=2.02;g.add(top);let ring=new THREE.Mesh(new THREE.TorusGeometry(.58,.09,12,36),new THREE.MeshStandardMaterial({color:[0xff7065,0xffb34d,0x5fb9ee,0x8f79e9,0x55c88b,0xf18ac0,0x53d0c2,0xffd35c][i],emissive:[0xff7065,0xffb34d,0x5fb9ee,0x8f79e9,0x55c88b,0xf18ac0,0x53d0c2,0xffd35c][i],emissiveIntensity:1.25}));ring.position.y=1.15;g.add(ring);g.position.copy(p);g.rotation.y=-a;g.userData={platform,ring};scene.add(g);gates.push(g)}for(let i=0;i<18;i++){let a=Math.random()*Math.PI*2,r=8.4+Math.random()*.7,x=Math.cos(a)*r,z=Math.sin(a)*r;let trunk=cyl(.13,.18,.95,0x7b5339);trunk.position.set(x,.48,z);scene.add(trunk);let crown=cyl(.55,.8,1.35,i%3?0x4fae64:0x67bd70);crown.position.set(x,1.5,z);scene.add(crown)}let fountain=cyl(1.25,1.45,.34,0xd8edf4);fountain.position.y=.17;scene.add(fountain);let water=cyl(.95,.95,.12,0x55bce8);water.position.y=.38;scene.add(water)}function makePlayer(){let g=new THREE.Group,body=cyl(.35,.45,.9,0x2d79c8);body.position.y=.9;g.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.32,24,16),mat(0xffd1aa));head.position.y=1.58;head.castShadow=true;g.add(head);let hair=new THREE.Mesh(new THREE.SphereGeometry(.335,24,16,0,Math.PI*2,0,Math.PI/2),mat(0x24384b));hair.position.y=1.67;g.add(hair);[-.22,.22].forEach((x,i)=>{let leg=cyl(.095,.11,.55,0x243c58);leg.position.set(x,.35,0);g.add(leg)});g.position.set(0,.2,0);return g}function clearWorld(){gates.forEach(g=>scene.remove(g));gates=[];for(let i=scene.children.length-1;i>=0;i--){let o=scene.children[i];if(o!==camera&&!(o instanceof THREE.Light)&&o!==player)scene.remove(o)}buildWorld();scene.add(player)}function applyTheme(){themeIndex=(level-1)%themes.length;clearWorld()}function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}function chooseNorth(){do north=Math.floor(Math.random()*8);while(north===lastNorth);lastNorth=north;let deg=north*45;$('needle').style.transform=`rotate(${deg}deg)`;$('bigNeedle').style.transform=`rotate(${deg}deg)`;let a=(deg-90)*Math.PI/180,r=$('smallCompass').clientWidth*.42,c=$('smallCompass').clientWidth/2;$('nmark').style.left=c+Math.cos(a)*r+'px';$('nmark').style.top=c+Math.sin(a)*r+'px';buildLabels()}function buildLabels(){document.querySelectorAll('.label').forEach(e=>e.remove());let s=$('bigCompass').clientWidth||410,c=s/2,r=s*.39;for(let geo=0;geo<8;geo++){let scr=(north+geo)%8,a=(scr*45-90)*Math.PI/180,e=document.createElement('div');e.className='label'+(geo===0?' n':'');e.textContent=names[geo];e.style.left=c+Math.cos(a)*r+'px';e.style.top=c+Math.sin(a)*r+'px';$('bigCompass').appendChild(e)}}function prepare(){moving=false;player.position.set(0,.2,0);chooseNorth();target=Math.floor(Math.random()*8);$('lv').textContent=`第 ${level} 關`;$('score').textContent=`分數 ${score}`;$('streak').textContent=`連勝 ${streak}`;$('task').innerHTML=`請找出 <b>${names[target]}</b> 的門`;setInput(true)}function setInput(v){buttons.forEach(b=>b.disabled=!v)}function correctScreen(){return(north+target)%8}function choose(i){if(!started||moving)return;moving=true;setInput(false);let end=new THREE.Vector3(vec[i].x*6.15,.2,vec[i].z*6.15),start=player.position.clone();player.rotation.y=Math.atan2(vec[i].x,vec[i].z);move={start,end,t:performance.now(),dur:920,done:()=>evaluate(i)}}function evaluate(i){move=null;if(i===correctScreen()){streak++;score+=100+Math.min(5,streak-1)*20;update();burst(gates[i].position);toast('方向正確！',`你成功找到${names[target]}`,'good');setTimeout(next,800)}else{streak=0;update();toast('方向不正確',`你選擇了畫面${screenNames[i]}，請再看紅色 N 指針`,'bad');setTimeout(()=>{let s=player.position.clone(),e=new THREE.Vector3(0,.2,0);player.rotation.y=Math.atan2(-s.x,-s.z);move={start:s,end:e,t:performance.now(),dur:780,done:()=>{move=null;moving=false;setInput(true)}}},1350)}}function update(){$('score').textContent=`分數 ${score}`;$('streak').textContent=`連勝 ${streak}`}function next(){if(level>=TOTAL){$('start').classList.add('open');$('start').querySelector('h1').textContent='🏆 任務完成！';$('start').querySelector('p').innerHTML=`你完成了 ${TOTAL} 關。<br>最終分數：<b>${score}</b>`;$('startBtn').textContent='再玩一次';$('startBtn').onclick=()=>location.reload();return}level++;$('transTitle').textContent='方向正確！';$('transSub').textContent=`進入第 ${level} 關：${themes[(level-1)%themes.length].name}`;makeSparks();$('transition').classList.add('show');setTimeout(()=>{applyTheme();prepare()},620);setTimeout(()=>$('transition').classList.remove('show'),1600)}function makeSparks(){$('transition').querySelectorAll('.spark').forEach(e=>e.remove());for(let i=0;i<24;i++){let e=document.createElement('i');e.className='spark';e.style.left=Math.random()*100+'%';e.style.top=60+Math.random()*35+'%';e.style.animationDelay=Math.random()+'s';$('transition').appendChild(e)}}function toast(a,b,cl){let t=$('toast');t.className='show '+cl;t.innerHTML=a+`<span>${b}</span>`;clearTimeout(t.tm);t.tm=setTimeout(()=>t.className='',1700)}function burst(pos){for(let i=0;i<75;i++){let m=new THREE.Mesh(new THREE.SphereGeometry(.05+Math.random()*.08,8,6),new THREE.MeshBasicMaterial({color:[0xffffff,0xffdd71,0x63e6ff,0xff8a69][i%4],transparent:true}));m.position.copy(pos).add(new THREE.Vector3(0,1.2,0));scene.add(m);let a=Math.random()*Math.PI*2,s=1.4+Math.random()*3.2;particles.push({m,v:new THREE.Vector3(Math.cos(a)*s,1+Math.random()*4,Math.sin(a)*s),life:1.1})}}function animate(){requestAnimationFrame(animate);let now=performance.now(),dt=Math.min(clock.getDelta(),.035),time=now*.001;if(move){let p=Math.min(1,(now-move.t)/move.dur),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;player.position.lerpVectors(move.start,move.end,e);player.position.y=.2+Math.abs(Math.sin(time*9))*.1;if(p>=1){let d=move.done;move=null;d()}}else player.position.y=.2+Math.sin(time*2.3)*.025;gates.forEach((g,i)=>{g.userData.ring.rotation.z=time*.35*(i%2?1:-1);g.userData.ring.position.y=1.15+Math.sin(time*2+i)*.08});for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.life-=dt;p.v.y-=4.5*dt;p.m.position.addScaledVector(p.v,dt);p.m.material.opacity=Math.max(0,p.life);if(p.life<=0){scene.remove(p.m);p.m.geometry.dispose();p.m.material.dispose();particles.splice(i,1)}}renderer.render(scene,camera)}buttons.forEach(b=>b.onclick=()=>choose(+b.dataset.i));$('hintBtn').onclick=()=>{$('overlay').classList.add('open');setTimeout(buildLabels,0)};$('close').onclick=()=>$('overlay').classList.remove('open');$('overlay').onclick=e=>{if(e.target===$('overlay'))$('overlay').classList.remove('open')};addEventListener('keydown',e=>{if(e.key==='Escape')$('overlay').classList.remove('open');let map={ArrowUp:0,e:1,ArrowRight:2,c:3,ArrowDown:4,z:5,ArrowLeft:6,q:7,w:0,d:2,s:4,a:6};if(map[e.key]!==undefined){e.preventDefault();choose(map[e.key])}});$('startBtn').onclick=()=>{$('start').classList.remove('open');started=true;prepare()};init()})();
</script></body></html>

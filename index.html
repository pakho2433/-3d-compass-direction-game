<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>3D八方向指南針遊戲</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#bcecff;font-family:"PingFang TC","Microsoft JhengHei",sans-serif;touch-action:none;color:#173b57}canvas{display:block}.glass{background:#fffffff0;border:3px solid #fff;border-radius:22px;box-shadow:0 9px 0 #65a9c477,0 18px 32px #16435b33;backdrop-filter:blur(8px)}#hud{position:fixed;z-index:10;left:12px;top:12px;width:min(430px,calc(100vw - 150px));padding:12px 15px}#stats{display:flex;gap:7px;flex-wrap:wrap;font-weight:900}.tag{padding:5px 10px;border-radius:999px;background:#e6f6fc}#task{margin-top:8px;font-size:clamp(18px,2.4vw,25px);font-weight:1000}#task b{color:#d6532d}#sub{font-size:13px;font-weight:800;opacity:.72;margin-top:4px}#dock{position:fixed;z-index:12;right:10px;top:10px;display:flex;flex-direction:column;align-items:center;gap:9px}#compass{position:relative;width:108px;height:108px;border:5px solid #fff;border-radius:50%;background:repeating-conic-gradient(#51738888 0 1deg,transparent 1deg 11.25deg),radial-gradient(circle,#fff 0 55%,#dff2fa 56% 69%,#79b9d2 70% 74%,#fff 75%);box-shadow:0 8px 0 #70a8bf,0 14px 25px #163b5138}#needle{position:absolute;inset:0;transform-origin:50% 50%;transition:.35s}#needle:before{content:"";position:absolute;left:50%;top:12%;width:14px;height:40%;transform:translateX(-50%);clip-path:polygon(50% 0,100% 100%,50% 82%,0 100%);background:#ef4740}#needle:after{content:"";position:absolute;left:50%;top:50%;width:10px;height:35%;transform:translateX(-50%);clip-path:polygon(0 0,50% 18%,100% 0,50% 100%);background:#244962}#hub{position:absolute;left:50%;top:50%;width:17px;height:17px;transform:translate(-50%,-50%);border:4px solid #fff;border-radius:50%;background:#173b57}#n{position:absolute;width:28px;height:28px;display:grid;place-items:center;transform:translate(-50%,-50%);border-radius:50%;background:#fff0ed;color:#d31d1d;font-weight:1000;border:2px solid #fff;transition:.35s}#hint{border:0;padding:10px 14px;font-size:16px;font-weight:1000;color:#173b57;cursor:pointer}#pad{position:fixed;z-index:11;left:12px;bottom:12px;display:grid;grid-template-columns:repeat(3,72px);grid-template-rows:repeat(3,64px);gap:7px;padding:9px;border-radius:22px;background:#ffffffd9;box-shadow:0 12px 28px #163b5135}.dir{border:0;border-radius:16px;background:linear-gradient(#fff,#e8f6fb);box-shadow:0 7px 0 #80bed6;color:#173b57;font-size:37px;font-weight:1000}.dir:active{transform:translateY(5px);box-shadow:0 2px 0 #80bed6}.dir:disabled{opacity:.45}.foot{display:grid;place-items:center;border-radius:50%;background:linear-gradient(145deg,#ffc16b,#ff8b32);font-size:28px}#toast{position:fixed;z-index:40;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);padding:18px 24px;border-radius:22px;background:#173f5aee;color:#fff;text-align:center;font-size:24px;font-weight:1000;opacity:0;pointer-events:none;transition:.2s}#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}#toast.good{background:#278a50ef}#toast.bad{background:#c94747ef}#modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:#0d304877;padding:16px}#modal.open{display:grid}#card{position:relative;width:min(520px,94vw);padding:18px;border-radius:28px;background:#f8fdff;text-align:center}#close{position:absolute;right:12px;top:10px;width:42px;height:42px;border:0;border-radius:50%;font-size:25px;font-weight:1000}#big{position:relative;width:min(400px,80vw);aspect-ratio:1;margin:12px auto;border:8px solid #fff;border-radius:50%;background:repeating-conic-gradient(#466b7f 0 1.5deg,transparent 1.5deg 11.25deg),radial-gradient(circle,#fff 0 59%,#8dc9e4 60% 66%,#fff 67%);box-shadow:0 12px 28px #163b5135}.lab{position:absolute;transform:translate(-50%,-50%);padding:4px 7px;border-radius:10px;background:#fffffff2;font-weight:1000;white-space:nowrap}.lab.north{color:#d31d1d;background:#ffe9e6}@media(max-width:650px){#hud{left:7px;top:7px;width:calc(100vw - 120px);padding:9px 11px}#task{font-size:16px}#sub{font-size:11px}#dock{right:6px;top:6px}#compass{width:94px;height:94px}#hint{font-size:14px;padding:8px 10px}#pad{left:7px;bottom:7px;grid-template-columns:repeat(3,57px);grid-template-rows:repeat(3,53px);gap:6px;padding:8px}.dir{font-size:30px}}</style></head><body><div id="game"></div><section id="hud" class="glass"><div id="stats"><span class="tag" id="lv">第1關</span><span class="tag" id="score">分數0</span><span class="tag" id="streak">連勝0</span></div><div id="task">請找出 <b>北方</b> 的門</div><div id="sub">觀察右上角紅色 N 指針，再按畫面箭嘴</div></section><div id="dock"><div id="compass"><div id="needle"></div><div id="hub"></div><div id="n">N</div></div><button id="hint" class="glass">🧭 小提示</button></div><div id="pad"><button class="dir" data-i="7">↖</button><button class="dir" data-i="0">↑</button><button class="dir" data-i="1">↗</button><button class="dir" data-i="6">←</button><div class="foot">👣</div><button class="dir" data-i="2">→</button><button class="dir" data-i="5">↙</button><button class="dir" data-i="4">↓</button><button class="dir" data-i="3">↘</button></div><div id="toast"></div><div id="modal"><div id="card"><button id="close">×</button><h2>八方位指南針</h2><div id="big"></div></div></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>(()=>{"use strict";const $=x=>document.getElementById(x),names=["北方","東北方","東方","東南方","南方","西南方","西方","西北方"],v=[{x:0,z:-1},{x:1,z:-1},{x:1,z:0},{x:1,z:1},{x:0,z:1},{x:-1,z:1},{x:-1,z:0},{x:-1,z:-1}],themes=[[0xbcecff,0x84cf7f,0xf0d6a5,0xf26f5d],[0xbbeef8,0x65cbb0,0xeadcc0,0x4f9ee7],[0xd5e7ff,0x91d274,0xead3bd,0xb37de5],[0xd6edf7,0xa7c879,0xe8d0a5,0xe68747]];let sc,cam,ren,pl,g=[],parts=[],world=[],level=1,score=0,streak=0,north=0,last=-1,target=0,busy=0,move=null,clock=new THREE.Clock;const btn=[...document.querySelectorAll('.dir')],R=5.45,S=4.35;function M(c){return new THREE.MeshStandardMaterial({color:c,roughness:.75})}function B(w,h,d,c){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.castShadow=m.receiveShadow=1;return m}function C(a,b,h,c){let m=new THREE.Mesh(new THREE.CylinderGeometry(a,b,h,18),M(c));m.castShadow=m.receiveShadow=1;return m}function camera(){let a=innerWidth/innerHeight;cam.aspect=a;cam.fov=a<.78?45:a<1.15?43:41;cam.position.set(0,a<.78?22:a<1.15?19:16.5,a<.78?18:a<1.15?15.8:14);cam.lookAt(0,.5,0);cam.updateProjectionMatrix()}function init(){sc=new THREE.Scene;ren=new THREE.WebGLRenderer({antialias:1});ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);ren.shadowMap.enabled=1;$('game').appendChild(ren.domElement);cam=new THREE.PerspectiveCamera(43,1,.1,100);camera();sc.add(new THREE.HemisphereLight(0xffffff,0x587357,2.3));let sun=new THREE.DirectionalLight(0xffffff,2.3);sun.position.set(-8,15,9);sun.castShadow=1;sc.add(sun);pl=player();build();sc.add(pl);addEventListener('resize',()=>{ren.setSize(innerWidth,innerHeight);camera()});newRound();loop()}function player(){let q=new THREE.Group,b=C(.35,.45,.9,0x2d79c8);b.position.y=.9;q.add(b);let h=new THREE.Mesh(new THREE.SphereGeometry(.32,20,14),M(0xffd1aa));h.position.y=1.58;q.add(h);let hair=new THREE.Mesh(new THREE.SphereGeometry(.335,20,14,0,Math.PI*2,0,Math.PI/2),M(0x24384b));hair.position.y=1.67;q.add(hair);q.position.y=.2;return q}function build(){let t=themes[(level-1)%themes.length];sc.background=new THREE.Color(t[0]);let base=B(16.8,.6,16.8,t[1]);base.position.y=-.34;sc.add(base);world.push(base);for(let o of [[14.8,.08,3],[3,.08,14.8]]){let p=B(o[0],o[1],o[2],t[2]);p.position.y=.02;sc.add(p);world.push(p)}for(let i=0;i<8;i++){let a=i*Math.PI/4,x=Math.sin(a)*R,z=-Math.cos(a)*R,q=new THREE.Group,p=C(.9,1,.18,0xffffff);p.position.y=.1;q.add(p);[-.55,.55].forEach(k=>{let s=B(.2,1.9,.2,0xf7fafc);s.position.set(k,1.02,0);q.add(s)});let top=B(1.35,.23,.26,t[3]);top.position.y=1.94;q.add(top);let col=[0xff7065,0xffb34d,0x5fb9ee,0x8f79e9,0x55c88b,0xf18ac0,0x53d0c2,0xffd35c][i],ring=new THREE.Mesh(new THREE.TorusGeometry(.54,.085,10,32),new THREE.MeshStandardMaterial({color:col,emissive:col,emissiveIntensity:1.2}));ring.position.y=1.1;q.add(ring);q.position.set(x,0,z);q.rotation.y=-a;q.userData={ring,stand:new THREE.Vector3(Math.sin(a)*S,.2,-Math.cos(a)*S)};sc.add(q);g.push(q)}for(let i=0;i<8;i++){let a=i*Math.PI/4+Math.PI/8,x=Math.cos(a)*6.9,z=Math.sin(a)*6.9,tr=C(.12,.17,.82,0x7b5339);tr.position.set(x,.41,z);sc.add(tr);world.push(tr);let cr=C(.46,.68,1.08,i%2?0x4fae64:0x67bd70);cr.position.set(x,1.3,z);sc.add(cr);world.push(cr)}}function clear(){g.forEach(x=>sc.remove(x));world.forEach(x=>sc.remove(x));g=[];world=[];build();sc.add(pl)}function roundCompass(){do north=Math.floor(Math.random()*8);while(north===last);last=north;let d=north*45;$('needle').style.transform=`rotate(${d}deg)`;let c=$('compass').clientWidth/2,r=c*.82,a=(d-90)*Math.PI/180;$('n').style.left=c+Math.cos(a)*r+'px';$('n').style.top=c+Math.sin(a)*r+'px';labels()}function labels(){$('big').querySelectorAll('.lab').forEach(x=>x.remove());let s=$('big').clientWidth||400,c=s/2,r=s*.39;for(let i=0;i<8;i++){let j=(north+i)%8,a=(j*45-90)*Math.PI/180,e=document.createElement('div');e.className='lab'+(i?'':' north');e.textContent=names[i];e.style.left=c+Math.cos(a)*r+'px';e.style.top=c+Math.sin(a)*r+'px';$('big').appendChild(e)}}function newRound(){busy=0;pl.position.set(0,.2,0);roundCompass();target=Math.floor(Math.random()*8);$('lv').textContent=`第${level}關`;$('score').textContent=`分數${score}`;$('streak').textContent=`連勝${streak}`;$('task').innerHTML=`請找出 <b>${names[target]}</b> 的門`;btn.forEach(x=>x.disabled=0)}function choose(i){if(busy)return;busy=1;btn.forEach(x=>x.disabled=1);let end=g[i].userData.stand.clone(),start=pl.position.clone(),f=g[i].position.clone().sub(end);pl.rotation.y=Math.atan2(f.x,f.z);move={start,end,t:performance.now(),done:()=>judge(i)}}function judge(i){move=null;if(i===(north+target)%8){streak++;score+=100;toast('方向正確！','good');burst(g[i].position);setTimeout(()=>{level++;clear();newRound()},900)}else{streak=0;toast('方向不正確','bad');setTimeout(()=>{let s=pl.position.clone(),e=new THREE.Vector3(0,.2,0);move={start:s,end:e,t:performance.now(),done:()=>{busy=0;btn.forEach(x=>x.disabled=0)}}},900)}$('score').textContent=`分數${score}`;$('streak').textContent=`連勝${streak}`}function toast(x,c){let t=$('toast');t.textContent=x;t.className='show '+c;setTimeout(()=>t.className='',1200)}function burst(p){for(let i=0;i<36;i++){let m=new THREE.Mesh(new THREE.SphereGeometry(.06,6,5),new THREE.MeshBasicMaterial({color:[0xffffff,0xffda67,0x68dfff][i%3],transparent:1}));m.position.copy(p).add(new THREE.Vector3(0,1,0));sc.add(m);parts.push({m,v:new THREE.Vector3((Math.random()-.5)*4,Math.random()*4,(Math.random()-.5)*4),life:1})}}function loop(){requestAnimationFrame(loop);let now=performance.now(),dt=Math.min(clock.getDelta(),.035),tm=now*.001;if(move){let p=Math.min(1,(now-move.t)/850),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;pl.position.lerpVectors(move.start,move.end,e);pl.position.y=.2+Math.abs(Math.sin(tm*9))*.08;if(p>=1){let d=move.done;move=null;d()}}else pl.position.y=.2+Math.sin(tm*2)*.02;g.forEach((q,i)=>{q.userData.ring.rotation.z=tm*.35*(i%2?1:-1)});for(let i=parts.length-1;i>=0;i--){let p=parts[i];p.life-=dt;p.v.y-=4*dt;p.m.position.addScaledVector(p.v,dt);p.m.material.opacity=p.life;if(p.life<=0){sc.remove(p.m);parts.splice(i,1)}}ren.render(sc,cam)}btn.forEach(x=>x.onclick=()=>choose(+x.dataset.i));$('hint').onclick=()=>{$('modal').classList.add('open');setTimeout(labels,0)};$('close').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};init()})();</script></body></html>
